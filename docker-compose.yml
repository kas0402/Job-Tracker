services:
  db:
    image: postgres:16
    container_name: jobtracker_db
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker_pass
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: jobtracker_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobtracker:jobtracker_pass@db:5432/jobtracker
      REDIS_URL:  redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    container_name: jobtracker_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: